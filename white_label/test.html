<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Customer Collection Hub · Prototype</title>
<meta name="description" content="White-label prototype of Customer Collection Hub. All names, emails and amounts are invented sample data.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{--adpg-header-h:64px;--adpg-sidebar-w:248px}
html,body{margin:0;padding:0;background:#F5F6F8;font-family:'Inter',system-ui,'Segoe UI',Tahoma,sans-serif;color:#1F2933}
.adm-topbar{position:fixed;top:0;left:0;right:0;height:var(--adpg-header-h);background:#1F2933;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:9000;box-shadow:0 1px 0 rgba(255,255,255,.06)}
.adm-top-left,.adm-top-right{display:flex;align-items:center;gap:12px;min-width:0}
.adm-top-center{position:absolute;left:50%;transform:translateX(-50%)}
.adm-menu-toggle{width:40px;height:40px;border-radius:12px;border:0;background:rgba(255,255,255,.08);display:grid;place-items:center;cursor:pointer}
.adm-menu-toggle svg{width:18px;height:18px;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round}
.proto-pill{font-size:11px;font-weight:600;letter-spacing:.04em;color:#D9E2EC;border:1px solid rgba(217,226,236,.35);border-radius:999px;padding:4px 10px;white-space:nowrap}
.adm-sidebar{position:fixed;top:var(--adpg-header-h);left:0;bottom:0;width:var(--adpg-sidebar-w);background:#27313B;color:#E4E7EB;overflow-y:auto;z-index:70;transition:transform .2s ease;padding:18px 0}
body.adpg-sidenav-collapsed .adm-sidebar{transform:translateX(-100%)}
.adm-sidebar-scope{padding:0 16px 16px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:10px}
.adm-collector-label{display:block;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#9AA5B1;margin-bottom:8px}
.adm-collector-select{width:100%;height:38px;border-radius:10px;border:0;padding:0 10px;font:inherit;font-size:13px;color:#1F2933;background:#fff}
.adm-nav-heading{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#7B8794;padding:16px 22px 6px}
.adm-nav-item{display:flex;align-items:center;gap:12px;padding:9px 22px;color:#E4E7EB;text-decoration:none;font-size:14.5px;border-left:3px solid transparent}
.adm-nav-item svg{width:17px;height:17px;stroke:#9AA5B1;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.adm-nav-item:hover{background:rgba(255,255,255,.05)}
.adm-nav-item.is-active{background:rgba(72,101,129,.35);border-left-color:#9FB3C8;color:#fff}
.adm-nav-item.is-active svg{stroke:#fff}
#cch-page{position:fixed;top:var(--adpg-header-h);left:var(--adpg-sidebar-w);right:0;bottom:0;overflow:auto;padding:22px 28px 60px;transition:left .2s ease}
body.adpg-sidenav-collapsed #cch-page{left:0}
@media(max-width:900px){#cch-page{left:0}.adm-sidebar{transform:translateX(-100%)}body.cch-menu-open .adm-sidebar{transform:none}.proto-pill{display:none}}
.pg-head{display:flex;align-items:baseline;gap:14px;margin:0 0 16px}
.pg-head h1{font-size:24px;margin:0;font-weight:700;color:#1F2933}.pg-head p{margin:0;color:#616E7C;font-size:14px}
.pg-tools{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.pg-tools input,.pg-tools select{height:38px;border:1px solid #D9E2EC;border-radius:10px;padding:0 12px;font:inherit;font-size:14px;background:#fff;min-width:240px}
.pg-card{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(31,41,51,.04),0 6px 20px rgba(31,41,51,.06);padding:18px 20px;margin-bottom:16px}
.pg-card h3{margin:0 0 12px;font-size:16px}
.pg-kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:16px}
.pg-kpi{background:#fff;border-radius:16px;box-shadow:0 1px 2px rgba(31,41,51,.04),0 6px 20px rgba(31,41,51,.06);padding:16px 18px;border-top:4px solid #486581}
.pg-kpi b{display:block;font-size:26px}.pg-kpi span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#616E7C;font-weight:600}
.pg-kpi small{display:block;color:#7B8794;margin-top:4px}
.pg-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:16px}
@media(max-width:1100px){.pg-kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.pg-grid{grid-template-columns:1fr}}
table.pg{width:100%;border-collapse:collapse;font-size:13.5px}
table.pg th{text-align:left;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:#7B8794;font-weight:700;padding:9px 10px;border-bottom:1px solid #E4E7EB;white-space:nowrap}
table.pg td{padding:10px;border-bottom:1px solid #F0F3F6;vertical-align:top}
table.pg tr.click{cursor:pointer}table.pg tr.click:hover td{background:#F5F7FA}
table.pg td.num,table.pg th.num{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
.pg-chip{display:inline-block;font-size:11px;font-weight:600;border-radius:999px;padding:2px 9px;background:#E4E7EB;color:#3E4C59;white-space:nowrap}
.pg-chip.red{background:#F6E3E1;color:#A33A2B}.pg-chip.green{background:#E3EEDF;color:#3F6E45}.pg-chip.amber{background:#F6EEDC;color:#8A6420}.pg-chip.blue{background:#E6EBF0;color:#334E68}
.pg-bars .row{display:grid;grid-template-columns:90px 1fr 120px;gap:10px;align-items:center;margin:8px 0;font-size:13px}
.pg-bars .bar{height:12px;border-radius:6px;background:#E4E7EB;overflow:hidden}.pg-bars .bar i{display:block;height:100%;background:#486581;border-radius:6px}
.pg-inbox{display:grid;grid-template-columns:minmax(280px,380px) 1fr;gap:16px;align-items:start}
.pg-inbox .list{max-height:calc(100vh - 190px);overflow:auto;padding:6px}
.pg-inbox .it{padding:12px 12px;border-radius:12px;cursor:pointer;border:1px solid transparent}
.pg-inbox .it:hover{background:#F5F7FA}.pg-inbox .it.on{background:#EEF2F6;border-color:#D9E2EC}
.pg-inbox .it b{display:block;font-size:14px}.pg-inbox .it small{color:#616E7C;display:block;margin-top:2px}
.pg-msg{border:1px solid #E4E7EB;border-radius:14px;padding:14px 16px;margin-bottom:12px;background:#fff}
.pg-msg.out{background:#F7F8FA}.pg-msg .hd{display:flex;justify-content:space-between;gap:10px;font-size:13px;color:#616E7C;margin-bottom:8px}
.pg-msg .bd{white-space:pre-wrap;font-size:14px;line-height:1.55}
.pg-draft{border:1px dashed #9FB3C8;border-radius:14px;padding:14px 16px;background:#F7F9FB}
.pg-btn{height:36px;border-radius:10px;border:0;padding:0 14px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;background:#486581;color:#fff}
.pg-btn.g{background:#E4E7EB;color:#1F2933}
.pg-muted{color:#7B8794;font-size:13px}


  .ihq-brand,.ihq-brand:link,.ihq-brand:visited{display:inline-flex!important;align-items:center!important;gap:10px!important;color:#fff!important;text-decoration:none!important;min-width:0!important}

  .ihq-brand-text{display:flex!important;flex-direction:column!important;line-height:1.15!important;min-width:0!important}
  .ihq-brand-text b{font-family:'Inter',system-ui,sans-serif!important;font-size:17px!important;font-weight:700!important;letter-spacing:.01em!important;white-space:nowrap!important}
  .ihq-brand-text small{font-size:10px!important;font-weight:300!important;color:rgba(255,255,255,.6)!important;white-space:nowrap!important}
  .ihq-top-tabs{display:flex!important;align-items:center!important;gap:10px!important}
  .ihq-tab,.ihq-tab:link,.ihq-tab:visited{display:inline-flex!important;align-items:center!important;justify-content:center!important;gap:10px!important;height:42px!important;min-width:132px!important;padding:0 16px!important;border-radius:13px!important;color:#fff!important;text-decoration:none!important;background:rgba(255,255,255,.08)!important;border:1px solid rgba(255,255,255,.10)!important;transition:background .15s ease,transform .15s ease,box-shadow .15s ease!important;cursor:pointer!important;box-sizing:border-box!important}
  .ihq-tab:hover{background:rgba(255,255,255,.16)!important;transform:translateY(-1px)!important}
  .ihq-tab.on{background:linear-gradient(135deg,#486581,#334E68)!important;border-color:rgba(255,255,255,.22)!important;box-shadow:0 4px 14px rgba(72,101,129,.35)!important}
  .ihq-tab svg{width:19px!important;height:19px!important;fill:none!important;stroke:#fff!important;stroke-width:1.9!important;stroke-linecap:round!important;stroke-linejoin:round!important;flex:0 0 auto!important}
  .ihq-tab-label{font-size:13px!important;font-weight:700!important;letter-spacing:.06em!important;text-transform:uppercase!important}
  .ihq-tab-badge{margin-left:2px!important}
  .ihq-tab-badge{background:#fff!important;color:#334E68!important;font-size:11px!important;line-height:20px!important;min-width:20px!important;padding:0 6px!important;border-radius:10px!important;text-align:center!important;font-weight:700!important;letter-spacing:0!important}
  .ihq-tab-badge[hidden],.ihq-umenu[hidden]{display:none!important}
  .ihq-top-actions{gap:10px!important}
  .ihq-hbtn{width:40px!important;height:40px!important;border-radius:12px!important;border:0!important;background:rgba(255,255,255,.1)!important;display:grid!important;place-items:center!important;cursor:pointer!important;padding:0!important}
  .ihq-hbtn:hover,.ihq-hbtn.on{background:#486581!important}
  .ihq-hbtn svg{width:16px!important;height:16px!important;stroke:#fff!important;fill:none!important;stroke-width:2!important}
  .ihq-me{position:relative!important}
  .ihq-av{width:40px!important;height:40px!important;border-radius:12px!important;border:0!important;background:#fff!important;color:#1F2933!important;display:grid!important;place-items:center!important;font-size:12px!important;font-weight:700!important;cursor:pointer!important;padding:0!important}
  .ihq-av:hover{background:#486581!important;color:#fff!important}
  .ihq-umenu{position:absolute!important;right:0!important;top:50px!important;width:272px!important;background:#fff!important;color:#1F2933!important;border-radius:16px!important;box-shadow:0 10px 28px rgba(31,41,51,.24)!important;padding:8px!important;z-index:9100!important;text-align:left!important}
  .ihq-umenu .who{padding:12px 14px 14px!important;border-bottom:1px solid #F0F2F5!important;margin-bottom:6px!important}
  .ihq-umenu .who b{display:block!important;font-size:14px!important;word-break:break-all!important}
  .ihq-umenu .who small{display:block!important;font-size:12px!important;color:#63666A!important;font-weight:300!important}
  .ihq-umenu a,.ihq-umenu a:link,.ihq-umenu a:visited{display:flex!important;align-items:center!important;gap:12px!important;padding:10px 14px!important;border-radius:12px!important;color:#1F2933!important;font-size:14px!important;text-decoration:none!important;cursor:pointer!important}
  .ihq-umenu a:hover{background:#F6F6F6!important}
  .ihq-umenu a svg{width:16px!important;height:16px!important;stroke:#63666A!important;fill:none!important;stroke-width:1.8!important;flex:0 0 auto!important}
  .ihq-umenu a small{display:block!important;font-size:11px!important;color:#63666A!important;font-weight:300!important}
  .ihq-umenu a.out{color:#A33A2B!important;border-top:1px solid #F0F2F5!important;border-radius:0 0 12px 12px!important;margin-top:6px!important}
  @media(max-width:1320px){.ihq-tab{min-width:112px!important}.ihq-brand-text small{display:none!important}}
  @media(max-width:1120px){.ihq-tab{min-width:0!important;height:40px!important;padding:0 12px!important}}
  @media(max-width:900px){.ihq-tab svg{display:none!important}.ihq-tab{height:36px!important;padding:0 10px!important}.ihq-brand-text{display:none!important}}
  

:root{
  --deep:#1F2933; --ocean:#486581; --press:#334E68;
  --white:#fff; --bg:#F5F6F8; --offwhite:#F3F4F6; --pearl:#E8ECF1; --silver:#A7A8A9; --space:#6B7280;
  --red:#C0504D; --green:#6A994E; --teal:#5F8D8B; --portsblue:#BCCCDC;
  --accent:#486581; --accent-ink:#fff;
  --xs:8px; --sm:16px; --md:24px; --lg:40px; --xl:64px;
  --r:16px; --rs:12px; --rp:999px;
  --sh:0 1px 2px rgba(31,41,51,.04),0 6px 20px rgba(31,41,51,.06);
  --sh2:0 10px 28px rgba(31,41,51,.14);
}
*{box-sizing:border-box}


#ihq{position:fixed;top:var(--adpg-header-h,64px);left:0;right:0;bottom:0;z-index:60;font-family:'Inter',system-ui,'Segoe UI',Tahoma,sans-serif;background:var(--bg);color:var(--deep);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;overflow:hidden;text-align:left;transition:left .2s ease}
@media(min-width:901px){html body:not(.adpg-sidenav-collapsed) #ihq{left:var(--adpg-sidebar-w,248px)}}
#ihq *{box-sizing:border-box}
#ihq button{font-family:inherit}
#ihq table{border-collapse:collapse}
#ihq h1,#ihq h2,#ihq h3,#ihq h4,#ihq p{margin-top:0}
#ihq a{text-decoration:none}
#ihq .loading{position:absolute;inset:0;display:grid;place-items:center;color:#63666A;font-size:14px;background:rgba(246,246,246,.6);z-index:10;pointer-events:none}
#ihq .loading[hidden]{display:none}
#ihq .err{background:#FDECEC;color:#A33A2B;border:1px solid #C0504D;border-radius:12px;padding:14px 18px;margin-bottom:16px;font-size:14px}
#ihq .modal{position:absolute;inset:0;background:rgba(31,41,51,.45);display:grid;place-items:center;z-index:9500}
#ihq .modal .box{background:#fff;border-radius:16px;padding:24px;width:min(520px,92%);box-shadow:0 20px 60px rgba(0,0,0,.25)}
#ihq .modal h3{margin:0 0 6px}
#ihq .modal label{display:block;font-size:12px;font-weight:700;letter-spacing:.06em;color:#63666A;margin:12px 0 4px}
#ihq .modal input,#ihq .modal textarea{width:100%;border:1px solid #E3E8EE;border-radius:10px;padding:10px 12px;font-family:inherit;font-size:14px}
#ihq .modal .mrow{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
#ihq .modal .box.wide{width:min(1120px,96%);max-height:88vh;overflow:auto}
#ihq .modal .box.wide.xl{width:min(1560px,97%);max-height:92vh}
#ihq .modal .box:focus{outline:none}
#ihq .modal .box.wide table{font-size:13px}
#ihq .modal .box.wide thead th{position:static}
h1,h2,h3,h4,h5{font-weight:700;line-height:1.2;margin:0}
button{font-family:inherit}
:focus-visible{outline:none;box-shadow:0 0 0 3px rgba(72,101,129,.35)}




.askbar{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:14px 18px 12px;margin-bottom:var(--md)}
.askbar .field{display:flex;align-items:center;gap:12px}
.askbar .field svg{width:20px;height:20px;stroke:var(--ocean);fill:none;stroke-width:2;flex:0 0 auto}
.askbar input{flex:1;border:0;background:transparent;font-family:inherit;font-size:17px;color:var(--deep);padding:8px 0}
.askbar input::placeholder{color:var(--silver)}
.askbar input:focus,.askbar input:focus-visible{outline:none;box-shadow:none}
.askbar .sugs{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.askbar .sugs span{font-size:11px;letter-spacing:.08em;color:var(--silver);font-weight:700;margin-right:4px}
.askbar .sugs button{border:0;background:var(--offwhite);color:var(--space);border-radius:var(--rp);padding:6px 12px;font-size:12px;cursor:pointer}
.askbar .sugs button:hover{background:#EEF2F6;color:var(--ocean)}


.scope{background:#fff;min-height:56px;display:flex;align-items:center;gap:var(--xs);padding:10px 32px 12px;flex:0 0 auto;flex-wrap:wrap}
.scope .lbl{font-size:10px;letter-spacing:.1em;color:var(--silver);font-weight:700;margin-right:4px}
.pill{border:1px solid var(--pearl);background:#fff;color:var(--space);border-radius:var(--rp);padding:7px 14px;font-size:12px;font-weight:700;letter-spacing:.04em;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:8px;transition:all .15s ease}
.pill .sw{width:8px;height:8px;border-radius:50%}
.pill:hover{border-color:var(--space)}
.pill.on{background:var(--deep);border-color:var(--deep);color:#fff}
.scope .arrow{color:var(--silver);font-size:16px;padding:0 4px}
.sub{border:0;background:var(--offwhite);color:var(--space);border-radius:var(--rp);padding:7px 12px;font-size:12px;font-weight:400;cursor:pointer;white-space:nowrap;display:flex;align-items:center;gap:7px;transition:all .15s ease}
.sub:hover{background:#E8ECF1;color:var(--deep)}
.sub.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.sub svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.8;opacity:.75}
.scopeinfo{margin-left:auto;font-size:12px;color:var(--space);display:flex;align-items:center;gap:8px;white-space:nowrap}
.scopeinfo i{width:7px;height:7px;border-radius:50%;background:var(--green);display:inline-block}
.scopeinfo i.bad{background:var(--red)}

.view{overflow-y:auto;padding:12px 32px 24px;flex:1}
.wrap{max-width:1440px;margin:0 auto}


.card{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:var(--md)}
.card.flush{padding:0;overflow:hidden}
.sechead{display:flex;align-items:baseline;gap:var(--sm);margin-bottom:var(--sm)}
.sechead h3{font-size:19px}
.sechead span{font-size:13px;color:var(--space);font-weight:300}
.sechead .link{margin-left:auto;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--ocean);cursor:pointer;background:none;border:0;padding:0}
.pagehead{display:flex;align-items:baseline;gap:14px;margin-bottom:10px}
.pagehead h2{font-size:22px;letter-spacing:-.01em}
.pagehead span{font-size:13px;color:var(--space);font-weight:300}
.btn{border:0;border-radius:var(--rp);padding:11px 20px;font-size:12px;font-weight:700;letter-spacing:.06em;cursor:pointer;transition:all .15s ease}
.btn-p{background:var(--deep);color:#fff}.btn-p:hover{background:var(--ocean)}
.btn-s{background:transparent;color:var(--deep);border:1px solid var(--deep)}.btn-s:hover{background:var(--deep);color:#fff}
.btn-g{background:var(--offwhite);color:var(--space);border:1px solid transparent}.btn-g:hover{background:#E8ECF1;color:var(--deep)}
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:var(--rp);padding:4px 10px;font-size:11.5px;font-weight:700;letter-spacing:.01em;white-space:nowrap}
.muted{color:var(--space);font-weight:300}
.ent{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;letter-spacing:.02em;color:var(--space);white-space:nowrap}
.ent i{width:8px;height:8px;border-radius:50%;display:block}
.ent small{font-weight:400;color:var(--silver)}
.warn{background:#FFF1F0;border-radius:var(--rs);padding:9px 16px;margin-bottom:12px;display:flex;align-items:center;gap:var(--sm);font-size:13px;line-height:1.4;color:var(--deep)}
.warn b{display:inline;font-size:11px;letter-spacing:.05em;color:var(--red);margin-right:10px}
.warn .btn{padding:8px 16px;font-size:11px}
.warn .btn{margin-left:auto;white-space:nowrap;background:var(--red);color:#fff}


.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:var(--md)}
.kpi{background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:16px 18px;text-align:left;color:var(--deep);width:100%;min-width:0;font-family:inherit}
.kpi .v{font-size:clamp(21px,1.75vw,29px);font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.01em;white-space:nowrap}
.kpi .v small{font-size:12px;font-weight:400;color:var(--space);margin-left:2px}
.kpi .l{font-size:10.5px;color:var(--space);letter-spacing:.04em;margin-top:6px;font-weight:700;line-height:1.3}
.kpi .d{font-size:11.5px;font-weight:700;margin-top:4px;line-height:1.35}
.kpi .d.up{color:#4F7A3E}.kpi .d.dn{color:var(--red)}

#ihq .card,#ihq .kpi,#ihq .tile,#ihq .dcard,#ihq .done0{position:relative;background:#fff;border:1px solid #D9E2EC;border-top:6px solid var(--ocean);box-shadow:0 2px 7px rgba(72,101,129,.12)}

#ihq .btn.soon,#ihq .btn.soon:hover{background:#ECEEF1!important;color:#A7A8A9!important;border-color:#ECEEF1!important;box-shadow:none!important;cursor:not-allowed;transform:none}
#ihq .btn.soon kbd{background:#DFE2E6;color:#A7A8A9;opacity:.8}

.kpi.go{cursor:pointer;transition:transform .12s ease,box-shadow .12s ease}
.kpi.go:hover{transform:translateY(-1px);box-shadow:0 8px 22px rgba(31,41,51,.14)}
.split li.go{cursor:pointer;border-radius:8px;margin-left:-6px;padding:2px 6px}
.split li.go:hover{background:#F7F8FA}
.feed li.go{cursor:pointer}
.feed li.go:hover{background:#F7F8FA}

.opts .skip{margin-left:auto;background:none;border:0;color:var(--silver);font-size:12px;font-weight:700;letter-spacing:.05em;cursor:pointer}
.opts .skip:hover{color:var(--deep)}
.done0{background:#fff;border-radius:20px;box-shadow:var(--sh2);padding:var(--xl) var(--lg);text-align:center}
.done0 .zero{font-size:64px;font-weight:700;line-height:1;color:#4F7A3E}
.done0 h2{font-size:30px;margin:var(--sm) 0}
.done0 p{max-width:52ch;margin:0 auto var(--md);color:var(--space);font-weight:300}
.done0 .sums{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--md);max-width:640px;margin:var(--lg) auto 0;text-align:left;border-top:1px solid var(--offwhite);padding-top:var(--md)}
.done0 .sums b{display:block;font-size:25px;font-variant-numeric:tabular-nums}
.done0 .sums span{font-size:11px;letter-spacing:.06em;color:var(--space)}


.tabs{display:flex;gap:6px;margin-bottom:var(--md);background:#fff;border-radius:var(--rp);padding:6px;box-shadow:var(--sh);width:fit-content}
.tabs button{background:none;border:0;border-radius:var(--rp);padding:9px 16px;font-size:12px;font-weight:700;letter-spacing:.05em;color:var(--space);cursor:pointer}
.tabs button.on{background:var(--deep);color:#fff}
.rule{display:grid;grid-template-columns:auto 1fr auto;gap:var(--sm);align-items:center;padding:18px 0;border-bottom:1px solid var(--offwhite)}
.rule:last-child{border-bottom:0}
.rule b{font-size:14px;display:block}
.rule p{margin:3px 0 0;font-size:13px;color:var(--space);font-weight:300}
.tgl{width:48px;height:28px;border-radius:14px;background:var(--pearl);position:relative;cursor:pointer;border:0;flex:0 0 auto;transition:background .18s ease}
.tgl i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .18s ease;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.tgl.on{background:var(--ocean)}.tgl.on i{left:23px}
.slider{display:flex;align-items:center;gap:12px;font-size:13px;color:var(--space)}
.slider input{width:190px;accent-color:var(--ocean)}
.slider b{font-variant-numeric:tabular-nums;color:var(--deep);min-width:58px;text-align:right;display:inline-block}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#4F7A3E}
.status i{width:7px;height:7px;border-radius:50%;background:#4F7A3E}
.status.bad{color:var(--red)}.status.bad i{background:var(--red)}
tr.subrow td{padding-top:10px;padding-bottom:10px;font-size:13px}
tr.subrow td:first-child{padding-left:48px;position:relative}
tr.subrow td:first-child:before{content:"";position:absolute;left:30px;top:0;bottom:50%;width:10px;border-left:1px solid var(--pearl);border-bottom:1px solid var(--pearl)}
.inherit{color:var(--silver);font-weight:300;font-size:12px}

#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(90px);background:var(--deep);color:#fff;padding:14px 22px;border-radius:var(--rp);font-size:13px;font-weight:700;box-shadow:var(--sh2);transition:transform .28s ease;z-index:50}
#toast.show{transform:translateX(-50%) translateY(0)}
#toast .tact{margin-left:14px;background:#fff;color:var(--deep);border:0;border-radius:var(--rp);padding:5px 11px;font-weight:700;font-size:12px;letter-spacing:.04em;cursor:pointer}
.dcard{position:relative}
.dcard .bring{position:absolute;top:14px;right:18px;background:none;border:0;color:var(--ocean);font-weight:700;font-size:11.5px;letter-spacing:.04em;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.dcard .bring:hover{color:var(--deep)}
.done0 .bring{position:static}

@media(max-width:1300px){.kpis,.tiles{grid-template-columns:repeat(3,1fr)}.grid2,.grid-acct,.curve,.dgrid{grid-template-columns:1fr}.curveside{border-left:0;border-top:1px solid var(--offwhite);padding:var(--sm) 0 0}.scopeinfo{display:none}}
@media(max-width:900px){.kpis,.tiles{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.scope{padding-left:16px;padding-right:16px}.view{padding:18px 16px}.kpis,.tiles{grid-template-columns:1fr}}

.ledgers{display:inline-flex;align-items:center;gap:5px;margin-left:14px;flex-wrap:wrap}
.ledgers .lbl{margin-right:2px}
.ledgers .lg{border:1px solid var(--pearl);background:#fff;color:var(--space);border-radius:var(--rp);padding:4px 10px;font-size:11px;font-weight:700;cursor:pointer}
.ledgers .lg.on{background:var(--deep);border-color:var(--deep);color:#fff}
.ledgers .lgnote{font-size:10.5px;color:#8995a5;margin-left:4px}


.rec .tonerow .tonelbl{font-size:11px;font-weight:700;letter-spacing:.02em;color:var(--ocean)}
.chip.tone.none{background:#F0F3F6;color:#63666A;font-weight:600}


.agroup{margin-bottom:var(--md)}
.agroup h4{font-size:12px;letter-spacing:.08em;color:var(--space);margin:0 0 10px}
.acards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.acard{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1px solid var(--pearl);border-radius:12px;padding:16px 18px;cursor:pointer;font:inherit;color:var(--deep)}
.acard:hover{border-color:var(--ocean);box-shadow:0 6px 18px rgba(72,101,129,.14)}
.acard b{font-size:14.5px}.acard .aline{font-size:13px;color:var(--space)}.acard small{font-size:11.5px;color:#8995a5}
.acard.soon{cursor:default;opacity:.6}
.uform{display:grid;gap:10px;margin:10px 0}.uform label{display:grid;gap:4px;font-size:12px;font-weight:700;color:var(--space)}
.uform input,.uform select{font:inherit;font-weight:400;font-size:13.5px;padding:8px 10px;border:1px solid var(--pearl);border-radius:8px}
.uform .urow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fuslist{display:flex;flex-wrap:wrap;gap:8px}.fuslist span{border:1px solid var(--pearl);border-radius:999px;padding:4px 10px;font-size:12.5px}.fuslist small{color:#8995a5}

function facetsOf(cs){const out=[];const add=(dim,key,l)=>{const g=cs.filter(c=>key(c));if(g.length)out.push({dim,k:l.k,l:l.l,n:g.length,a:sum(g,c=>c.amt)})};

function work(p){const all=scoped(p);let cs=all.slice();const L=p.list||'all',has=(v,x)=>!v||v.split(',').filter(Boolean).length===0||v.split(',').includes(x);

  const rows=cs.map(c=>({id:c.id,acct:c.acct,acc:c.acc,cust:c.cust,amt:c.amt,amt_ledger:c.amt,b:c.b,c:c.c,cl:c.cl,sub:c.sub,sub_id:c.sub_id,cls:c.cls,ai:c.ai,ai_l:{AUTO:'AI SENT REMINDER',WATCH:'AI MONITORING',DRAFT:'DRAFT WAITING',HUMAN:'WITH YOU'}[c.ai],

  const tl=(f)=>{const g=all.filter(f);return [sum(g,c=>c.amt),g.length]};

  return {rows,facets,tiles:[{all_a:aa,all_n:an,attention:all.filter(c=>over(c)>0).length,agent_a:ga,agent_n:gn,me_a:ma,me_n:mn,dispute_a:da,dispute_n:dn,promise_a:pa,promise_n:pn,n90_a:na,n90_n:nn}],

    case 'unskip':{const n=p.decision_id?1:Object.keys(ST.skipped).length;if(p.decision_id)delete ST.skipped[+p.decision_id];else ST.skipped={};return {message:n+' card'+(n===1?'':'s')+' back in your stack',count:n}}

function toast(t,act){const e=document.getElementById('toast');e.textContent=t;clearTimeout(e._t);clearInterval(e._i);

function errText(e){if(!e)return 'The console could not complete this request.';if(typeof e==='string')return e;if(e.message)return e.message;
 const st=e.status||(e.jqXHR&&e.jqXHR.status)||0;
 if(st===429)return 'The server is busy (too many requests). Wait a minute, then press TRY AGAIN.';
 if(e.responseJSON&&e.responseJSON.message)return e.responseJSON.message;

const LOADING={},FAILED={};
const clearFailed=()=>{Object.keys(FAILED).forEach(k=>delete FAILED[k])};
function load(kind,params){
  const key=kind+'|'+JSON.stringify(params||{});
  if(LOADING[kind]===key||FAILED[kind]===key)return;
  LOADING[kind]=key;busy(true);let shown=false;
  const ops={dash:'dash',work:'work',acct:'account',deck:'decisions',mailboxes:'tune_mailboxes',autonomy:'tune_settings',voice:'tune_settings',escalation:'tune_ladder',activity:'tune_log',home:'tune_home',access:'tune_access',usage:'tune_usage'};
  return API.call(ops[kind],params).then(r=>{
    if(LOADING[kind]!==key){busy(false);return}
    delete LOADING[kind];delete FAILED[kind];shown=true;
    if(kind==='dash'||kind==='work'||kind==='acct')D[kind]=r;
    else if(kind==='deck'){D.deck=r.deck;D.deckMeta=r;S.decided=[];S.skipped=[];S.deck=remaining()[0]??D.deck.length}
    else D.tune[kind]=r;
    busy(false);render();return r;
  }).catch(e=>{const mine=LOADING[kind]===key;if(mine){delete LOADING[kind];FAILED[kind]=key}busy(false);if(mine||shown)fail(e)});
}

document.addEventListener('keydown',ev=>{
 if(ev.repeat)return;
 if(S.modal){if(ev.key==='Escape'){closeModal();return}
  const el=document.activeElement,typing=el&&(el.tagName==='TEXTAREA'||el.tagName==='INPUT');
  if(S.modalKind==='review'&&!typing&&Date.now()-(S.modalAt||0)>400&&!ev.ctrlKey&&!ev.altKey&&!ev.metaKey){
   if(ev.key==='1'){ev.preventDefault();const b=document.getElementById('send-go');if(b)b.click()}
   else if(ev.key==='2'){ev.preventDefault();closeModal()}
   else if(ev.key==='3'){const a=document.getElementById('send-inbox');if(a){ev.preventDefault();a.click()}}}
  return}
 if(S.view!=='today'||!D.deck||S.deck>=D.deck.length)return;
 const t=document.activeElement;if(t&&(t.id==='q'||t.tagName==='TEXTAREA'||t.tagName==='INPUT'))return;
 if(/^[1-9]$/.test(ev.key)&&!ev.ctrlKey&&!ev.altKey&&!ev.metaKey){const b=deckButtons(D.deck[S.deck])[+ev.key-1];if(b)decide(S.deck,b.o.k,b.mode)}
 if(ev.key.toLowerCase()==='s')skip(S.deck);
 if(ev.key.toLowerCase()==='d'&&D.deck[S.deck]&&D.deck[S.deck].has_draft==='Y'){const so=(D.deck[S.deck].opts||[]).find(o=>o.send==='Y');if(so)decide(S.deck,so.k,'review')}
});
document.addEventListener('keydown',e=>{if(e.key==='/'&&!['INPUT','TEXTAREA'].includes(document.activeElement.tagName)&&!S.modal){e.preventDefault();if(!S.askOpen)toggleAsk();else{const q=document.getElementById('q');if(q){q.focus();q.select()}}}if(e.key==='Escape'&&S.askOpen){S.askOpen=false;S.ask=null;S.qtext='';D.work=null;render()}});

window.addEventListener('hashchange',route);
document.addEventListener('click',function(e){const t=e.target.closest&&e.target.closest('#ihq-ask-btn,#ihq-av,.ihq-tab,#adm-nav-tune,#cch-menu,.adm-nav-item[data-page]');
  const menu=document.getElementById('ihq-umenu'),av=document.getElementById('ihq-av');
  if(!t){if(menu&&!menu.hidden&&!(e.target.closest&&e.target.closest('#ihq-umenu'))){menu.hidden=true;if(av)av.setAttribute('aria-expanded','false')}return}
  if(t.id==='cch-menu'){e.preventDefault();document.body.classList.toggle(window.innerWidth<=900?'cch-menu-open':'adpg-sidenav-collapsed');return}
  if(t.id==='ihq-ask-btn'){showConsole(null);if(window.IHQ)IHQ.toggleAsk();return}
  if(t.id==='ihq-av'){if(menu){menu.hidden=!menu.hidden;t.setAttribute('aria-expanded',String(!menu.hidden))}return}
  if(t.id==='adm-nav-tune'){e.preventDefault();history.replaceState(null,'',location.pathname+location.search);showConsole('agent');return}
  if(t.classList.contains('ihq-tab')){e.preventDefault();history.replaceState(null,'',location.pathname+location.search);showConsole(t.getAttribute('data-view'));return}
  const k=t.dataset.page;if(k==='console'){e.preventDefault();history.replaceState(null,'',location.pathname+location.search);showConsole('dash')}});
document.addEventListener('DOMContentLoaded',()=>{const s=document.getElementById('adm_view_collector');if(s)s.value=window.CCH.viewAs();setTimeout(route,0)});
})();
</script>
</body></html>
